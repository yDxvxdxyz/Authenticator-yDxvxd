<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yDxvxd Authenticator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d, #262626);
      color: #e5e5e5;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 560px; }

    .card {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      padding: 32px 0 20px 0;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      color: #f5f5f5;
      margin: 0;
      font-weight: 700;
    }
    .subtitle {
      color: #a3a3a3;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .content { padding: 32px; }

    input, textarea {
      width: 100%;
      padding: 16px;
      background: rgba(50, 50, 50, 0.9);
      border: 1px solid rgba(96, 96, 96, 0.4);
      border-radius: 12px;
      color: #f5f5f5;
      margin-bottom: 16px;
      font-size: 1rem;
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6b7280;
      background: rgba(60, 60, 60, 0.95);
    }
    textarea { resize: vertical; min-height: 110px; }

    button {
      width: 100%;
      padding: 16px;
      background: rgba(75, 75, 75, 0.95);
      color: #f5f5f5;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 8px 0;
    }
    button:hover {
      background: rgba(96, 96, 96, 0.95);
      transform: translateY(-2px);
    }
    button.primary {
      background: #3b82f6;
    }
    button.primary:hover {
      background: #2563eb;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: rgba(45, 45, 45, 0.8);
      border: 1px solid rgba(96, 96, 96, 0.4);
      border-radius: 12px;
    }
    .secret {
      font-family: 'Space Grotesk', monospace;
      background: rgba(20, 20, 20, 0.8);
      padding: 18px;
      border-radius: 10px;
      font-size: 1.05rem;
      word-break: break-all;
      border: 1px solid rgba(128, 128, 128, 0.3);
    }
    .totp {
      font-family: 'Space Grotesk', monospace;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 12px;
      text-align: center;
      color: #22c55e;
      margin: 24px 0;
      user-select: none;
    }
    .time-left {
      text-align: center;
      color: #a3a3a3;
      font-size: 0.95rem;
    }

    .hidden { display: none; }
    .logout-btn {
      background: #ef4444;
      font-size: 0.95rem;
      padding: 10px 18px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="container">

    <div id="login-screen">
      <div class="card">
        <div class="header">
          <h1>yDxvxd</h1>
          <p class="subtitle">Authenticator System</p>
        </div>
        <div class="content">
          <input type="text" id="username" value="admin" placeholder="Usuário">
          <input type="password" id="password" placeholder="Senha">
          <button class="primary" onclick="login()">Entrar</button>
        </div>
      </div>
    </div>

    <div id="main-app" class="hidden">
      <div class="card">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 32px 10px;">
          <div>
            <h1>yDxvxd</h1>
            <p class="subtitle">Link Temporário</p>
          </div>
          <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
        
        <div class="content">
          <h3 style="margin: 0 0 16px 0; color: #f5f5f5;">Gerar Link Temporário</h3>
          <textarea id="secret-input" placeholder="Cole o segredo Base32 aqui..."></textarea>
          <button class="primary" onclick="generateLink()">Gerar Link (válido por 1 hora)</button>

          <div id="link-result" class="result hidden">
            <strong style="color:#a3a3a3;">Link gerado:</strong>
            <input type="text" id="generated-link" readonly>
            <button onclick="copyLink()">📋 Copiar Link</button>
          </div>
        </div>
      </div>
    </div>

    <div id="view-mode" class="hidden">
      <div class="card">
        <div class="header">
          <h1>yDxvxd</h1>
          <p class="subtitle">Segredo Compartilhado</p>
        </div>
        <div class="content">
          <h3>Segredo Base32</h3>
          <div id="secret-display" class="secret"></div>
          
          <h3 style="margin-top: 28px;">Código TOTP</h3>
          <div id="totp-code" class="totp">------</div>
          <div id="time-left" class="time-left">Expira em --:--</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_HASH = "a0f8e4c9b2d7e5f1a3b6c8d9e0f2a4b7c1d3e5f6a8b0c2d4e6f8a0b2c4d6e8f";

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if (user !== "admin" || await hashPassword(pass) !== ADMIN_HASH) {
        alert("Credenciais inválidas");
        return;
      }

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
    }

    function logout() {
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('password').value = '';
    }

    function base32Decode(input) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      input = input.replace(/=+$/, '').toUpperCase();
      let bits = "";
      for (let i = 0; i < input.length; i++) {
        const val = alphabet.indexOf(input[i]);
        if (val === -1) continue;
        bits += val.toString(2).padStart(5, '0');
      }
      let bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.substr(i, 8), 2));
      }
      return new Uint8Array(bytes);
    }

    async function generateTOTP(base32Secret) {
      try {
        const keyBytes = base32Decode(base32Secret);
        const epoch = Math.floor(Date.now() / 1000);
        const timeCounter = Math.floor(epoch / 30);

        const counterBuffer = new ArrayBuffer(8);
        new DataView(counterBuffer).setBigUint64(0, BigInt(timeCounter), false);

        const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
        const hmac = await crypto.subtle.sign("HMAC", cryptoKey, counterBuffer);
        const hmacArray = new Uint8Array(hmac);

        const offset = hmacArray[hmacArray.length - 1] & 0xf;
        const binary = ((hmacArray[offset] & 0x7f) << 24) |
                       ((hmacArray[offset + 1] & 0xff) << 16) |
                       ((hmacArray[offset + 2] & 0xff) << 8) |
                       (hmacArray[offset + 3] & 0xff);

        return (binary % 1000000).toString().padStart(6, '0');
      } catch (e) { return "ERRO"; }
    }

    function generateLink() {
      const secret = document.getElementById('secret-input').value.trim();
      if (!secret) return alert("Digite o segredo Base32!");

      const exp = Date.now() + 60 * 60 * 1000;
      const data = { s: secret, exp: exp };
      const encoded = btoa(JSON.stringify(data));

      const url = new URL(window.location.href);
      url.searchParams.set('d', encoded);

      document.getElementById('generated-link').value = url.toString();
      document.getElementById('link-result').classList.remove('hidden');
    }

    function copyLink() {
      const link = document.getElementById('generated-link');
      link.select();
      document.execCommand('copy');
      alert("✅ Link copiado!");
    }

    async function checkViewLink() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get('d');
      if (!encoded) return;

      try {
        const data = JSON.parse(atob(encoded));
        if (Date.now() > data.exp) {
          alert("Este link expirou!");
          window.location.search = '';
          return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('view-mode').classList.remove('hidden');

        document.getElementById('secret-display').textContent = data.s;

        async function update() {
          const code = await generateTOTP(data.s);
          document.getElementById('totp-code').textContent = code;

          const remaining = Math.floor((data.exp - Date.now()) / 1000);
          const min = Math.floor(remaining / 60);
          const sec = remaining % 60;
          document.getElementById('time-left').textContent = `Expira em ${min}:${sec.toString().padStart(2, '0')}`;
        }

        update();
        setInterval(update, 1000);
      } catch(e) {
        alert("Link inválido");
      }
    }

    window.onload = checkViewLink;
  </script>
</body>
</html>
